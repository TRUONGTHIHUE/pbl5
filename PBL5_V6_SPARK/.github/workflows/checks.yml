name: Source checks and ESP-IDF build
on: [push, pull_request, workflow_dispatch]
jobs:
  logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y libzbar0 xvfb
      - run: python -m pip install -r pc/requirements-dev.txt
      - run: python scripts/run_checks.py
      - run: xvfb-run -a python tests/gui_smoke.py
  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5
    steps:
      - uses: actions/checkout@v4
      - name: Build requested ESP-IDF version
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          idf.py set-target esp32
          idf.py build
# This workflow has NOT been run as part of this handoff. It never deploys Firebase.
